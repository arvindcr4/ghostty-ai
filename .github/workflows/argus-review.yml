name: Argus Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  argus-review:
    # Opt-in: this fork's GitHub-hosted runners are unavailable (account
    # billing lock), so the job fails at startup and marks every PR red.
    # Skip unless explicitly enabled:
    #   gh variable set ARGUS_REVIEW_ENABLED --body true
    if: vars.ARGUS_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Argus Code Review
        uses: sasa-tomic/argus-code-review-action@b594e0d53698974a63483a6f57957f0a287eea2c # v1.0.5
        with:
          cursor-api-key: ${{ secrets.CURSOR_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
